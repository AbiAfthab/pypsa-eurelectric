# PyPSA-Eurelectric specific configuration defaults
# This file contains settings specific to the Eurelectric project
# that extend/override the base PyPSA-Eur configuration.
#
# These settings are loaded after config.default.yaml and override
# base values where needed.

# =============================================================================
# RUN SETTINGS
# =============================================================================
run:
  prefix: "2026-05-24"
  name: "Myopic-2030-2040"
  disable_progressbar: true
  shared_cutouts: true

foresight: myopic

scenario:
  clusters:
  - 37
  opts:
  - ""
  sector_opts:
  - ""
  planning_horizons:
  - 2030
  - 2040

costs:
  year: 2030
  # ETS-like CO2 prices (EUR/t); applied in prepare_sector_network per horizon
  emission_prices:
    enable: true
    co2:
      2030: 100
      2040: 171

co2_budget:
  2030: 0.45
  # 2040: 0.15 corresponds to 85% reduction vs 1990 (relaxed from previous
  # 90% reduction). Combined with no new OCGT/CCGT Generators below, this is
  # the climate-cap setting used by the 10countries batmin scenarios.
  2040: 0.15
# =============================================================================
# ATLITE / CUTOUTS
# =============================================================================
atlite:
  default_cutout: "europe-2019-sarah3-era5"

# =============================================================================
# SNAPSHOTS
# =============================================================================
snapshots:
  start: "2019-01-01"
  end: "2020-01-01"
  inclusive: left
# =============================================================================
# COUNTRIES
# =============================================================================
# EU27 + UK + Norway + Switzerland (excludes Balkans: AL, BA, ME, MK, RS, XK)
countries:
- AT
- BE
- BG
- CH
- CZ
- DE
- DK
- EE
- ES
- FI
- FR
- GB
- GR
- HR
- HU
- IE
- IT
- LT
- LU
- LV
- NL
- "NO"
- PL
- PT
- RO
- SE
- SI
- SK

electricity:
  renewable_carriers: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float, hydro]
  # No new OCGT/CCGT as Generators — fossil gas can only come from brownfield
  # capacity in `conventional_carriers`. NOTE: gas can still appear via the
  # sector backdoor (`sector.chp.fuel: [gas]` and `sector.conventional_generation`).
  extendable_carriers:
    Generator: [solar, solar-hsat, onwind, offwind-ac, offwind-dc, offwind-float]
    StorageUnit: [battery]
    Store: [H2]
    Link: []
  # v1.5 = +50% AC+DC line volume vs today's grid. Eases the binding lv_limit
  # shadow seen in the 10countries 2040 batmin runs.
  transmission_limit: "v1.5"

# =============================================================================
# RENEWABLE — per-country offshore potential overrides (BE / DE)
# =============================================================================
# Applied at network-attach time in `attach_wind_and_solar`. Scales `p_nom_max`
# and `p_max_pu` per bus by ISO2 country, equivalent to changing
# `capacity_per_sqkm` / `correction_factor` in the GIS step when
# `resource_classes == 1`. See `OFFSHORE_BE_DE_OPTION_B.md` for rationale.
renewable:
  # After the brownfield adjustment in `solve_network.add_land_use_constraint`
  # (existing capacity is subtracted from extendable `p_nom_max`), the actual
  # upper bound on total installed offshore is `k_cap * original_GIS` (existing
  # is NOT added on top). Sizing therefore needs `k_cap * original_GIS >= CCL_min`.
  #
  # BE: original GIS = 1.742 GW; CCL min 2040 = 7.36 GW -> k_cap >= 4.23.
  #     Picked 4.5 -> scaled potential 7.84 GW (~6 % above min, just under CSV max 8.0 GW).
  # DE: original GIS = 26.354 GW; CCL min 2040 = 55.00 GW -> k_cap >= 2.09.
  #     Picked 2.5 -> scaled potential 65.89 GW (~20 % above min, below CSV max 73 GW).
  #
  # Physical interpretation: new offshore zones in BE / DE (Princess Elisabeth,
  # extra North Sea allocations etc.) with normal North-Sea wind conditions.
  # k_corr is kept at 1.0 so the per-MW capacity factor stays at the global
  # default (`correction_factor: 0.8855`).
  "offwind-ac":
    country_potential_overrides:
      BE: {capacity_per_sqkm_scale: 4.5, correction_factor_scale: 1.0}
      DE: {capacity_per_sqkm_scale: 2.5, correction_factor_scale: 1.0}
  "offwind-dc":
    country_potential_overrides:
      BE: {capacity_per_sqkm_scale: 4.5, correction_factor_scale: 1.0}
      DE: {capacity_per_sqkm_scale: 2.5, correction_factor_scale: 1.0}
  "offwind-float":
    country_potential_overrides:
      BE: {capacity_per_sqkm_scale: 4.5, correction_factor_scale: 1.0}
      DE: {capacity_per_sqkm_scale: 2.5, correction_factor_scale: 1.0}

# =============================================================================
# CLUSTERING
# =============================================================================
clustering:
  temporal:
    # 2920SEG = ~3h equivalent via adaptive segmentation (captures peaks better
    # than fixed 3h sampling at the same number of timesteps). Switch back to
    # "3h" or "1460SEG" (6h) only if memory/time is an issue.
    resolution_sector: "2920SEG"

# =============================================================================
# DATASETS (override defaults from config.default.yaml)
# =============================================================================
# Build BASt mobility profiles locally so extended CSVs (bus, hd, lfw) are
# produced. Archive mode only retrieves pre-built kfz/pkw from pypsa.org.
data:
  mobility_profiles:
    source: build
    version: latest


# =============================================================================
# SECTOR COUPLING SETTINGS
# =============================================================================
sector:
  #enforcing min battery capacity. data from TYNDP_2026
  battery_p_nom_min_enable: true
  battery_p_nom_min_file: data/battery_p_nom_min.csv
  battery_p_nom_min_include_existing: true   # recommended: subtract fixed capacity
  # Disabled features for eurelectric runs
  gas_network: true
  H2_network: false
  H2_retrofit: false
  reduce_space_heat_exogenously: true
  reduce_space_heat_exogenously_factor:
    2030: 0.08
    2040: 0.1
  district_heating:
    progress:
      2030: 0.09
      2040: 0.21
  residential_heat:
    dsm:
      enable: true
      direction:
      - overheat
      - undercool
      restriction_value:
        2030: 0.25
        2040: 0.37
  land_transport_passenger_km_scaling:
    2020: 1.01
    2030: 1.03
    2040: 1.06
  land_transport_truck_km_scaling:
    2020: 1.01
    2030: 1.03
    2040: 1.06
  land_transport_van_km_scaling:
    2020: 1.01
    2030: 1.03
    2040: 1.06
  land_transport_bus_km_scaling:
    2020: 1.01
    2030: 1.03
    2040: 1.06

  # Per-country, per-segment fuel shares (electric / fuel_cell / ice). Same CSV layout
  # as data/agg_p_nom_minmax.csv: two header rows (year × fuel), index columns country, segment.
  # Used when prepare_sector_network reads this file (enable + path); YAML shares below remain fallback if disabled.
  land_transport_fuel_shares_enable: true
  land_transport_fuel_shares_file: data/land_transport_fuel_shares.csv

  hydrogen_turbine: true
  hydrogen_fuel_cell: true
  # Class-specific plugged-in availability assumptions
  pkw_bev_avail_max: 0.95
  pkw_bev_avail_mean: 0.80
  bus_bev_avail_max: 0.90
  bus_bev_avail_mean: 0.60
  hd_bev_avail_max: 0.85
  hd_bev_avail_mean: 0.70
  lfw_bev_avail_max: 0.92
  lfw_bev_avail_mean: 0.70
  bev_energy: 0.08
  bev_dsm_availability: 0.15
  regional_oil_demand: false
  regional_co2_sequestration_potential:
    enable: false
  co2_spatial: false
  co2_network: false
  imports:
    enable: true
    limit: 100
    limit_sense: "<="
    price:
      H2: 61
  methanol:
    methanol_to_power:
      ocgt: true
  ammonia: false
  biomass_spatial: false
  biomass_to_liquid: false
  electrobiofuels: false
  dac: false
  limit_max_growth:
    enable: true
    factor: 1.5
  co2_sequestration_potential:
    2020: 0
    2025: 0
    2030: 40
    2035: 100
    2040: 240
    2045: 250

    # Truck fuel shares
  land_transport_truck_fuel_cell_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.10
    2040: 0.20
    2045: 0.30
  land_transport_truck_electric_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.15
    2040: 0.30
    2045: 0.45
  land_transport_truck_ice_share:
    2020: 1
    2025: 1
    2030: 0.90
    2035: 0.75
    2040: 0.50
    2045: 0.25
    # Van fuel shares
  land_transport_van_fuel_cell_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.10
    2040: 0.20
    2045: 0.30
  land_transport_van_electric_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.15
    2040: 0.30
    2045: 0.45
  land_transport_van_ice_share:
    2020: 1
    2025: 1
    2030: 0.90
    2035: 0.75
    2040: 0.50
    2045: 0.25
    # Bus fuel shares
  land_transport_bus_fuel_cell_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.10
    2040: 0.20
    2045: 0.30
  land_transport_bus_electric_share:
    2020: 0
    2025: 0
    2030: 0.05
    2035: 0.15
    2040: 0.30
    2045: 0.45
  land_transport_bus_ice_share:
    2020: 1
    2025: 1
    2030: 0.90
    2035: 0.75
    2040: 0.50
    2045: 0.25

# For Electric Efficiency: https://ev-database.org/de/cheatsheet/energy-consumption-electric-car
  # Light : average energy consumption 188 Wh/km = 0.188 kWh/km = 18.8 kWh/100 km = 0.0188 MWh/ 100 km
    # 15 kWh/100 km = 0.015 MWh/100km => 1MWh = 66.66 * 100km
    # 1/0.188 -> 1 MWh = 53.19 * 100 km
  # Vans: https://www.preprints.org/manuscript/202511.1882/v1/download
    # assume 25 kWh/100 km = 0.025 MWh/100 km
  # Heavy: assume 40 kWh/100 km = 0.04 MWh/100 km

# For Fuel Cell efficiency:  https://h2-mobility.de/wp-content/uploads/2021/02/H2M_Flottenpapier_English_20180822.pdf
    # Light: assume in average 1kg_H2 per 100 km -> 1kg_H2 = 33 kWh_H2 (LHV)
    # Reasonable assumption to use it also for the Van category
    # 1 MWh_H2 = 30.003 100km     
    # Heavy: assume 8.5 kg_H2 per 100 km -> 0.2805 MWh_H2 per 100 km

# For ICE efficiency:
# Light: average consumption 7 liter per 100 km
    # 0.008889 MWh_petrol = 1 liter
    # 0.062223 MWh_petrol / 100 km
    # 1 MWh_petrol = 16.0712
# Van: average consumption 7.2 liter per 100 km
    # 0.008889 MWh_petrol = 1 liter
    # 0.0640008 MWh_petrol / 100 km
    # 1 MWh_petrol = 15.6
# Heavy: average consumption 30 liter per 100 km
    # 0.008889 MWh_petrol = 1 liter
    # 0.26667 MWh_petrol / 100 km
    # 1 MWh_petrol = 3.75

  transport_passenger_electric_efficiency: 53.19
  transport_passenger_fuel_cell_efficiency: 30.003
  transport_passenger_ice_efficiency: 16.0712

  transport_truck_electric_efficiency: 25
  transport_truck_fuel_cell_efficiency: 3.565
  transport_truck_ice_efficiency: 3.75

  transport_van_electric_efficiency: 40
  transport_van_fuel_cell_efficiency: 30.003
  transport_van_ice_efficiency: 15.6

  transport_bus_electric_efficiency: 25
  transport_bus_fuel_cell_efficiency: 3.565
  transport_bus_ice_efficiency: 3.75


  # Electric vehicle flexibility
  bev_dsm: true
  v2g: true

# =============================================================================
# INDUSTRY SETTINGS
# =============================================================================
industry:
  # Waste-to-energy
  waste_to_energy: true
  waste_to_energy_cc: true

  # HVC sequestration
  HVC_environment_sequestration_fraction: 0.5

  # V3: economically optional DSR with technology breakdown and capital costs.
  # Config keys use FfE profile names (e.g. "Iron & steel industry"), not PyPSA industry categories
  # (e.g. Electric arc, Cement). See INDUSTRY_CATEGORY_TO_PROFILE in build_industrial_energy_demand_per_node.py.
  #
  # Physical/engineering parameters (technology_breakdown, shift_hours, restriction_time,
  # negative_only, min_load, ramp_rate) are defined here as they describe the structure
  # and physical limits of industrial processes — constant across scenarios.
  # Scenario-varying parameters (enable, store_capital_cost, flexibility_fraction)
  # should be overridden in run-specific configs.
  dsr:
    enable: true
    store_capital_cost: 5.0
    link_capital_cost: 0.0
    restriction_value: 1.0

    # How each FfE profile is split into sub-technologies (shares must sum to 1.0)
    technology_breakdown:
      "Iron & steel industry":
        "Scrap-EAF": "auto"
        "H2-DRI-EAF": "auto"
        "BF-BOF-CCUS": "auto"
        "Aluminium-primary": "auto"
        "Aluminium-secondary": "auto"
        "Alumina": "auto"
        "Manufacturing": 0.05
      "Non-metallic Minerals":
        "Cement mills": 0.40
        "Raw mills": 0.26
        "Kiln": 0.27
        "Other": 0.07
      "Paper, Pulp and Print":
        "Pulp production": 0.30
        "Paper machines": 0.50
        "Printing": 0.20
      "Non-specified (Industry)":
        "Chlor-alkali": 0.10
        "Other chemicals": 0.90

    # Flexibility fractions per technology (override in run configs for high/low flex scenarios)
    flexibility_fraction:
      "Iron & steel industry|Scrap-EAF": 0.85
      "Iron & steel industry|H2-DRI-EAF": 0.20
      "Iron & steel industry|BF-BOF-CCUS": 0.05
      "Iron & steel industry|Manufacturing": 0.0
      "Iron & steel industry|Aluminium-primary": 0.125
      "Iron & steel industry|Aluminium-secondary": 0.125
      "Iron & steel industry|Alumina": 0.0
      "Non-metallic Minerals|Cement mills": 0.42
      "Non-metallic Minerals|Raw mills": 0.42
      "Non-metallic Minerals|Kiln": 0.0
      "Non-metallic Minerals|Other": 0.0
      "Paper, Pulp and Print|Pulp production": 0.60
      "Paper, Pulp and Print|Paper machines": 0.0
      "Paper, Pulp and Print|Printing": 0.60
      "Non-specified (Industry)|Chlor-alkali": 0.10
      "Non-specified (Industry)|Other chemicals": 0.15
      "Food and Tobacco": 0.10
      "Textile and Leather": 0.10
      "Wood and Wood Products": 0.10
      "Transport Equipment": 0.10
      "Machinery": 0.10

    # Maximum shifting window per technology (physical/engineering constraint)
    shift_hours:
      "Iron & steel industry|Scrap-EAF": 2
      "Iron & steel industry|H2-DRI-EAF": 6
      "Iron & steel industry|BF-BOF-CCUS": 1
      "Iron & steel industry|Aluminium-primary": 3
      "Iron & steel industry|Aluminium-secondary": 3
      "Iron & steel industry|Alumina": 0
      "Non-metallic Minerals|Cement mills": 4
      "Non-metallic Minerals|Raw mills": 4
      "Paper, Pulp and Print|Pulp production": 6
      "Paper, Pulp and Print|Printing": 6
      "Non-specified (Industry)|Chlor-alkali": 4
      "Non-specified (Industry)|Other chemicals": 4
      "Food and Tobacco": 4
      "Textile and Leather": 4
      "Wood and Wood Products": 4
      "Transport Equipment": 4
      "Machinery": 4

    # Checkpoint hours for energy balance enforcement
    restriction_time:
      "Iron & steel industry|Scrap-EAF": [6, 18]
      "Iron & steel industry|H2-DRI-EAF": [0, 12]
      "Iron & steel industry|BF-BOF-CCUS": [6, 18]
      "Iron & steel industry|Aluminium-primary": [0]
      "Iron & steel industry|Aluminium-secondary": [0]
      "Iron & steel industry|Alumina": [0]
      "Non-metallic Minerals|Cement mills": [0]
      "Non-metallic Minerals|Raw mills": [0]
      "Paper, Pulp and Print|Pulp production": [0]
      "Paper, Pulp and Print|Printing": [0]
      "Non-specified (Industry)|Chlor-alkali": [0]
      "Non-specified (Industry)|Other chemicals": [0]
      "Iron & steel industry": [6, 18]
      "Non-metallic Minerals": [0, 12]
      "Paper, Pulp and Print": [0]
      "Non-specified (Industry)": [0]
      "Food and Tobacco": [8, 20]
      "Textile and Leather": [8, 20]
      "Wood and Wood Products": [8, 20]
      "Transport Equipment": [6, 18]
      "Machinery": [6, 18]

    # Technologies that can only reduce load (not increase)
    negative_only:
      "Non-specified (Industry)|Chlor-alkali": true

    # Minimum operational load (hard constraint, fraction of baseline)
    min_load:
      "Non-specified (Industry)|Chlor-alkali": 0.70

    # Ramp rate limits
    ramp_rate:
      default: 0.1
      "Iron & steel industry|BF-BOF-CCUS": 0.04
      "Iron & steel industry|Aluminium-primary": 0.08
      "Iron & steel industry|Alumina": 0.06
      "Non-metallic Minerals|Kiln": 0.04
      "Non-metallic Minerals|Raw mills": 0.2
      "Non-metallic Minerals|Cement mills": 0.2
      "Paper, Pulp and Print|Paper machines": 0.1
      "Non-specified (Industry)|Chlor-alkali": 0.1

  temporal_electricity_industry_load: true

# =============================================================================
# TRANSMISSION PROJECTS
# =============================================================================
transmission_projects:
  include:
    tyndp2020: true
    nep: false
    manual: true

# =============================================================================
# DATA CENTERS
# =============================================================================
data_center:
  # DC DSR: ON by default in eurelectric runs (previously false in upstream
  # default — the silent default caused 176 TWh of DC load to be modelled as
  # inflexible in earlier runs). Override to false for "noflex" sensitivities.
  dsr:
    enable: true
    capital_cost: 0.1
    marginal_cost: 0.1
    p_pct_nom: 0.05
    shift_hours: 12
  enable: true
  load:
    profile: High Voltage Import
    profile_year: 2024
  "on-site generation":
    enable: false
    p_pct_nom: 0.2
    reference_technology: OCGT
  "on-site storage":
    enable: false
    p_pct_nom: 0.2
    shift_hours: 6
    reference_technology: battery
  grid_connection: "Grid to data center"

# =============================================================================
# SOLVING SETTINGS
# =============================================================================
solving:
  options:
    # Collect shadow prices (duals) for every constraint — needed for CCL,
    # lv_limit, CO2, sequestration shadow analysis.
    assign_all_duals: true
    # Load-shedding fall-back at 10 000 EUR/MWh so peak-hour scarcity is priced
    # explicitly instead of returning infeasible (especially relevant when new
    # OCGT/CCGT Generators are disabled).
    load_shedding:
      enable: true
      default_cost: 10000
      all_carriers: true
      carriers: {}
  agg_p_nom_limits:
    agg_offwind: true
    agg_solar: true
    include_existing: true
    # NOMAX = validated `min` floors only; `max` columns blanked so the model
    # is free to overbuild any RES carrier where economic. Switch back to
    # `data/agg_p_nom_valideted_cap.csv` for runs with capped maxes.
    file: data/agg_p_nom_TEST_NOMAX.csv
  constraints:
    CCL: true
    EQ: false
    BAU: false
    SAFE: false
  solver:
    name: gurobi
    options: gurobi-eurelectric
  solver_options:
    gurobi-eurelectric:
      method: 2
      crossover: 0
      BarHomogeneous: -1
      BarConvTol: 1.0e-05
      FeasibilityTol: 0.0001
      OptimalityTol: 0.0001
      threads: 4
      Seed: 123
      NumericFocus: 0
      AggFill: 0
      PreDual: 0
      GURO_PAR_BARDENSETHRESH: 200
      IISMethod: 1
  mem_mb: 128000
