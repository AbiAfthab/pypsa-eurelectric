# Grid study - "Inaction" scenario (MILD, 85%).
# Caps annualised distribution-grid investment at 85% of the cost-optimal level
# revealed by the Build run (D*), per horizon. Because myopic carries the
# previously-built grid forward as sunk/fixed capacity, the cap bites only on
# the capacity ADDED in each horizon:
#
#   Build D* (extendable / newly-added, annualised):
#     2030: 30.666 bn EUR/yr  -> 85% = 26.066
#     2040: 14.184 bn EUR/yr  -> 85% = 12.056
#
# This point sits in the "mild underinvestment" regime we want to characterise
# (substitution via flexibility / local resources with limited load shedding),
# in contrast to the 50% "grid-collapse" endpoint dominated by unserved energy.
# Load shedding stays ON (10 000 EUR/MWh) so a little unserved energy is allowed
# and reported as a physical impact.
#
# Run (stacks base overlay + this file); myopic solves 2030 then 2040:
#   snakemake -call solve_sector_networks \
#     --configfile config/config.eurelectric.default.yaml \
#                 config/grid-study/config.base-2040.yaml \
#                 config/grid-study/config.inaction-2040-mild85.yaml

run:
  name: "grid-inaction-2040-mild85"

grid_study:
  # Per-horizon annualised investment cap (bn EUR/yr) on ADDED distribution grid.
  distribution_grid_budget_bn_per_year:
    2030: 26.066
    2040: 12.056
