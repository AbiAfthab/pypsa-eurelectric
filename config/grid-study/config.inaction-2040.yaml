# Grid study - "Inaction" scenario (MODERATE, 50%).
# Caps annualised distribution-grid investment at 50% of the cost-optimal level
# revealed by the Build run (D*), per horizon. Because myopic carries the
# previously-built grid forward as sunk/fixed capacity, the cap bites only on
# the capacity ADDED in each horizon:
#
#   Build D* (extendable / newly-added, annualised):
#     2030: 30.666 bn EUR/yr  -> 50% = 15.333
#     2040: 14.184 bn EUR/yr  -> 50% =  7.092
#
# Run (stacks base overlay + this file); myopic solves 2030 then 2040:
#   snakemake -call solve_sector_networks \
#     --configfile config/config.eurelectric.default.yaml \
#                 config/grid-study/config.base-2040.yaml \
#                 config/grid-study/config.inaction-2040.yaml
#
# The cost of inaction = (this run's objective - Build objective); the dual of
# the "distribution_grid_investment_budget" constraint gives the marginal system
# cost per EUR of grid not built (assign_all_duals is on).

run:
  name: "grid-inaction-2040-moderate"

grid_study:
  # Per-horizon annualised investment cap (bn EUR/yr) on ADDED distribution grid.
  distribution_grid_budget_bn_per_year:
    2030: 15.333
    2040: 7.092
