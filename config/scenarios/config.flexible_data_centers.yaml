run:
  name: "flexible_data_centers"
  disable_progressbar: true
  shared_resources:
    policy: false
  shared_cutouts: true

data_center:
  dsr:
    enable: true
    capital_cost: 0.1
    marginal_cost: 0.1
    p_pct_nom: 0.05 # note: do we really want 25% of the nominal capacity here or about 25% of the demand?
    shift_hours: 12
  load:
    profile: High Voltage Import
    profile_year: 2024
    method: max
  "on-site generation":
    enable: false
    p_pct_nom: 0.2
    reference_technology: OCGT
  "on-site storage":
    enable: false
    p_pct_nom: 0.2
    shift_hours: 6
    reference_technology: battery
  grid_connection: "Grid to data center"
