run:
  name: "flexible_data_centers_store_and_gen"
  disable_progressbar: true
  shared_resources:
    policy: false
  shared_cutouts: true

data_center:
  dsr:
    enable: false
    capital_cost: 0.1
    marginal_cost: 0.1
    p_pct_nom: 0.05
    shift_hours: 12
  load:
    profile: High Voltage Import
    profile_year: 2024
    method: max
  "on-site generation":
    enable: true
    p_pct_nom: 0.3
    reference_technology: OCGT
  "on-site storage":
    enable: true
    p_pct_nom: 0.3
    shift_hours: 6
    reference_technology: battery
  grid_connection: "Grid to data center"
